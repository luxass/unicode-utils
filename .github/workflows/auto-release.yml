name: Auto Release

on:
  pull_request:
    types: [closed]
    branches:
      # this will limit the github actions a bit.
      - main

jobs:
  auto-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: (
      github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'update-generated-files'
      && github.repository == 'luxass/unicode-utils' && github.event.pull_request.user.login == 'luxass'
      )
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # needed by the npx bumpp -r cmd to create a tag
          token: ${{ secrets.AUTO_RELEASE_TOKEN }}
          persist-credentials: true

      - name: setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: setup node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: install dependencies
        run: pnpm install

      - name: build
        run: pnpm run build

      - name: create tag and release
        run: |

          CURRENT_VERSION=$(cat packages/unicode-utils/package.json | jq -r '.version')
          echo "Current version: $CURRENT_VERSION"

          NEXT_VERSION=""

          # If we are using beta or alpha versions, we should auto-release those
          if [[ "$CURRENT_VERSION" == *"-beta"* || "$CURRENT_VERSION" == *"-alpha"* ]]; then
            NEXT_VERSION=$(echo $CURRENT_VERSION | awk -F'[.-]' '{printf "%d.%d.%d-%s.%d", $1, $2, $3, $4, $5+1}')
          else
            NEXT_VERSION=$(echo $CURRENT_VERSION | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')
          fi

          if [ -z "$NEXT_VERSION" ]; then
            echo "Could not determine next version"
            exit 1
          fi

          echo "Next version: $NEXT_VERSION"


          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          npx bumpp -r $NEXT_VERSION --commit --tag --push --yes
        env:
          GITHUB_TOKEN: ${{ secrets.AUTO_RELEASE_TOKEN }}
