name: Auto Release

on:
  pull_request:
    types: [closed]
    branches:
      # this will limit the github actions a bit.
      - main

jobs:
  auto-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment:
      name: auto-release
      deployment: false
    if: >-
      github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'update-ucd-files' &&
        github.repository == 'luxass/unicode-utils' &&
        github.event.pull_request.user.login == 'luxass'
    steps:
      - name: generate token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # needed by the npx bumpp -r cmd to create a tag
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: install dependencies
        run: pnpm install

      - name: build
        run: pnpm run build

      - name: create tag and release
        run: |
          CURRENT_VERSION=$(cat packages/unicode-utils/package.json | jq -r '.version')
          echo "Current version: $CURRENT_VERSION"

          NEXT_VERSION=""

          # If we are using beta or alpha versions, we should auto-release those
          if [[ "$CURRENT_VERSION" == *"-beta"* || "$CURRENT_VERSION" == *"-alpha"* ]]; then
            NEXT_VERSION=$(echo $CURRENT_VERSION | awk -F'[.-]' '{printf "%d.%d.%d-%s.%d", $1, $2, $3, $4, $5+1}')
          else
            NEXT_VERSION=$(echo $CURRENT_VERSION | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')
          fi

          if [ -z "$NEXT_VERSION" ]; then
            echo "Could not determine next version"
            exit 1
          fi

          echo "Next version: $NEXT_VERSION"

          npx bumpp -r $NEXT_VERSION --commit --tag --push --yes
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
