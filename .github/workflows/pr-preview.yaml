name: Preview Release

on:
  pull_request:
    branches: [main]
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'luxass' && github.event.action == 'labeled' && github.event.label.name == 'preview' }}
    permissions:
      contents: read
      pull-requests: write
    name: verify build and tests
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: remove preview label
        if: always()
        uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0 # v1.3.0
        with:
          labels: "preview"

  publish-preview:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    name: publish preview packages
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*

      - name: install dependencies
        run: pnpm install

      - name: build
        run: pnpm --filter "@luxass/unicode-utils" run build

      - name: lint
        run: pnpm --filter "@luxass/unicode-utils" run lint

      - name: typecheck
        run: pnpm --filter "@luxass/unicode-utils" run typecheck

      - name: test
        run: pnpm run test

      - name: publish packages
        run: |
          pnpm dlx pkg-pr-new publish --pnpm --compact 'packages/unicode-utils'
