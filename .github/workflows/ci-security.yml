name: GitHub Actions Security Analysis

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "renovate/**"
    paths:
      - ".github/workflows/**"

jobs:
  zizmor:
    uses: luxass/shared-workflows/.github/workflows/ci-security.yaml@8aac9be01e1d8e1f4cc968c966865f8021b47037 # v0.3.0
    with:
      zizmor-version: v1.23.1
