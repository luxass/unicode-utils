name: GitHub Actions Security Analysis

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "renovate/**"
    paths:
      - ".github/workflows/**"

jobs:
  zizmor:
    uses: luxass/shared-workflows/.github/workflows/ci-security.yaml@554e26b2e40b5deab8185f0f1f0259ac1b33c252 # v0.2.0
    with:
      zizmor-version: v1.23.1
