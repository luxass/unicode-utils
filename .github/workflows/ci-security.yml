name: GitHub Actions Security Analysis

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "renovate/**"
    paths:
      - ".github/workflows/**"

jobs:
  zizmor:
    uses: luxass/shared-workflows/.github/workflows/ci-security.yaml@262ac659334b242eb257cb94bc16bc61ae0e1101 # v0.1.0
    with:
      zizmor-version: v1.23.1
