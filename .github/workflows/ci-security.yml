name: GitHub Actions Security Analysis

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "renovate/**"
    paths:
      - ".github/workflows/**"

jobs:
  zizmor:
    uses: luxass/shared-workflows/.github/workflows/ci-security.yaml@8754e8bba6acdee2fa9e450cd230b702825ed48f # v0.3.1
    permissions:
      contents: read
      security-events: write
    with:
      zizmor-version: v1.23.1
