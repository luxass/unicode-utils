name: Preview Release

on:
  pull_request:
    branches: [main]
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'luxass' && github.event.action == 'labeled' && github.event.label.name == 'preview' }}
    permissions:
      contents: read
      pull-requests: write
    name: verify build and tests
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: remove preview label
        if: always()
        uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0 # v1.3.0
        with:
          labels: "preview"

  publish-preview:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    name: publish preview packages
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: setup node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: lts/*

      - name: install dependencies
        run: pnpm install

      - name: build
        run: pnpm --filter "@luxass/unicode-utils" run build

      - name: lint
        run: pnpm --filter "@luxass/unicode-utils" run lint

      - name: typecheck
        run: pnpm --filter "@luxass/unicode-utils" run typecheck

      - name: test
        run: pnpm run test

      - name: publish packages
        run: |
          pnpm dlx pkg-pr-new publish --pnpm --compact 'packages/unicode-utils'
