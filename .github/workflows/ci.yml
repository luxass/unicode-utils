name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

jobs:
  ci:
    uses: luxass/shared-workflows/.github/workflows/ci.yaml@2220edc7539f582da81215b73dd32f3edde06a3c # v0.3.2
    permissions:
      contents: read
    with:
      fmt: true
      fmt-script: "fmt:check"

  test:
    uses: luxass/shared-workflows/.github/workflows/test.yaml@2220edc7539f582da81215b73dd32f3edde06a3c # v0.3.2
    permissions:
      contents: read
