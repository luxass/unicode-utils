name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

jobs:
  ci:
    uses: luxass/shared-workflows/.github/workflows/ci.yaml@8754e8bba6acdee2fa9e450cd230b702825ed48f # v0.3.1
    permissions:
      contents: read
    with:
      fmt: true
      fmt-script: "fmt:check"

  test:
    uses: luxass/shared-workflows/.github/workflows/test.yaml@8754e8bba6acdee2fa9e450cd230b702825ed48f # v0.3.1
    permissions:
      contents: read
