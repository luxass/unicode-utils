ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: "no-downgrade"
strictDepBuilds: true
blockExoticSubdeps: true

packages:
  - "packages/*"
  - "tooling/*"
  - "playground"

catalogs:
  types:
    "@types/node": 24.13.2
    "@types/picomatch": 4.0.3

  build:
    picomatch: 4.0.5
    zod: 4.4.3
    "@luxass/utils": 2.7.5

  testing:
    msw: 2.14.6
    vitest: 4.1.2

  dev:
    tsx: 4.23.0
    typescript: 6.0.3
    tsdown: 0.22.3
    publint: 0.3.21
    turbo: 2.9.7
    rolldown: 1.1.4
    oxlint: 1.57.0
    oxfmt: 0.58.0
    oxlint-tsgolint: 0.24.0

overrides:
  rolldown: catalog:dev
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.5.3 || 11.8.0
  - pnpm@11.5.3 || 11.8.0
