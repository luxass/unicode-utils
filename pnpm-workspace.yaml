ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: "no-downgrade"
strictDepBuilds: true
blockExoticSubdeps: true

packages:
  - "packages/*"
  - "tooling/*"
  - "playground"

catalogs:
  types:
    "@types/node": 24.19.2
    "@types/picomatch": 4.0.3

  build:
    picomatch: 4.0.7
    zod: 4.4.2
    "@luxass/utils": 2.7.5

  testing:
    msw: 2.15.0
    vitest: 4.1.2

  dev:
    tsx: 4.23.15
    typescript: 6.0.3
    tsdown: 0.23.2
    publint: 0.3.25
    turbo: 2.9.7
    rolldown: 1.2.15
    oxlint: 1.57.0
    oxfmt: 0.74.0
    oxlint-tsgolint: 0.25.0

overrides:
  rolldown: catalog:dev
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.5.3 || 11.8.0 || 11.11.0
  - pnpm@11.5.3 || 11.8.0 || 11.11.0
