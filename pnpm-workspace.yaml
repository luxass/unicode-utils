ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: "no-downgrade"
strictDepBuilds: true
blockExoticSubdeps: true

packages:
  - "packages/*"
  - "tooling/*"
  - "playground"

catalogs:
  types:
    "@types/node": 24.12.2
    "@types/picomatch": 4.0.3

  build:
    picomatch: 4.0.4
    zod: 4.4.2
    "@luxass/utils": 2.7.3

  testing:
    msw: 2.14.2
    vitest: 4.1.2

  dev:
    tsx: 4.21.0
    typescript: 6.0.3
    tsdown: 0.21.10
    publint: 0.3.18
    turbo: 2.9.7
    rolldown: 1.0.0-rc.18
    oxlint: 1.57.0
    oxfmt: 0.47.0
    oxlint-tsgolint: 0.22.1

overrides:
  rolldown: catalog:dev
