ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: "no-downgrade"
strictDepBuilds: true
blockExoticSubdeps: true

packages:
  - "packages/*"
  - "tooling/*"
  - "playground"

catalogs:
  types:
    "@types/node": 24.12.0
    "@types/picomatch": 4.0.2

  build:
    picomatch: 4.0.4
    zod: 4.3.6
    "@luxass/utils": 2.7.3
    defu: 6.1.4

  testing:
    msw: 2.12.14
    vitest: 4.1.2

  dev:
    tsx: 4.21.0
    typescript: 6.0.2
    tsdown: 0.21.7
    publint: 0.3.18
    turbo: 2.8.20
    rolldown: 1.0.0-rc.12
    oxlint: 1.57.0
    oxfmt: 0.42.0
    oxlint-tsgolint: 0.18.1

overrides:
  rolldown: catalog:dev
minimumReleaseAgeExclude:
  # Renovate security update: defu@6.1.5
  - defu@6.1.5
